name: release

# Publishing only. Every test runs locally first (npm run test:full); this
# re-runs the unit tier as a last gate and builds the release from the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The recorded piano and claves are Git LFS objects: without them the
      # tests read pointer files and package.sh refuses to ship one.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The recorded piano and claves are Git LFS objects: without them the
      # tests read pointer files and package.sh refuses to ship one.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the tag matches the manifest
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src/module.json)
          tag=${GITHUB_REF#refs/tags/v}
          test "$version" = "$tag" || { echo "module.json $version != tag $tag" >&2; exit 1; }
      # The web page ships the piano as wasm: build.sh builds it, then the page
      # with vite, which needs the npm dependencies.
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: sh scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/piano-practice-module.tar.gz
          generate_release_notes: true

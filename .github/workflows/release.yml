name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the tag matches the manifest
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src/module.json)
          tag=${GITHUB_REF#refs/tags/v}
          test "$version" = "$tag" || { echo "module.json $version != tag $tag" >&2; exit 1; }
      - run: sh scripts/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/piano-practice-module.tar.gz
          generate_release_notes: true

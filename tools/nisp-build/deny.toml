# nisp-build's dependencies, held to the project's licence allowlist (the same
# list as neon-ingvy-audio-plugins/deny.toml). nisp-build ships in no tarball,
# but what it is built from is still checked:
#
#   cargo deny check licenses bans sources
#
# The runtime crates in dsp/ have one dependency, libm (MIT).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

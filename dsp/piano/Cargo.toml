[package]
name = "piano"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Piano Practice built-in piano, as a Schwung DSP plugin."

[lib]
name = "piano"
crate-type = ["cdylib", "rlib"]

[features]
default = ["rt"]
rt = ["schwung-plugin/rt"]

[dependencies]
schwung-plugin = { path = "../schwung-plugin", default-features = false }
libm = "0.2"
